<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de voluntário – Pata Voluntária</title>
<meta name="description" content="Cadastre-se como voluntário da Pata Voluntária e escolha onde quer ajudar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="index.html">🐾 Pata Voluntária</a>
  <nav aria-label="Principal"><a href="index.html">Início</a><a href="projetos.html">Projetos</a><a href="cadastro.html" aria-current="page">Cadastro</a></nav>
</div></header>

<main><section><div class="wrap">
  <h1>Cadastro de voluntário</h1>
  <p>Preencha seus dados e escolha onde quer ajudar. Os campos com * são obrigatórios.</p>

  <form id="cadastro">
    <div class="full"><label for="nome">Nome completo *</label>
      <input id="nome" name="nome" type="text" autocomplete="name" required><p class="err" id="err-nome"></p></div>
    <div><label for="email">E-mail *</label>
      <input id="email" name="email" type="email" autocomplete="email" required><p class="err" id="err-email"></p></div>
    <div><label for="telefone">Telefone *</label>
      <input id="telefone" name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(31) 91234-5678" data-mask="tel" required><p class="err" id="err-telefone"></p></div>
    <div><label for="cpf">CPF *</label>
      <input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" data-mask="cpf" required><p class="err" id="err-cpf"></p></div>
    <div><label for="nascimento">Data de nascimento *</label>
      <input id="nascimento" name="nascimento" type="date" autocomplete="bday" required><p class="err" id="err-nascimento"></p></div>
    <div><label for="cep">CEP *</label>
      <input id="cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" data-mask="cep" required><p class="err" id="err-cep"></p></div>
    <div><label for="endereco">Endereço *</label>
      <input id="endereco" name="endereco" type="text" autocomplete="street-address" required><p class="err" id="err-endereco"></p></div>
    <div><label for="cidade">Cidade *</label>
      <input id="cidade" name="cidade" type="text" autocomplete="address-level2" required><p class="err" id="err-cidade"></p></div>
    <div><label for="estado">Estado *</label>
      <select id="estado" name="estado" autocomplete="address-level1" required>
        <option value="">Selecione</option>
        <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option>
      </select><p class="err" id="err-estado"></p></div>

    <fieldset class="full"><legend>Onde você quer ajudar?</legend>
      <label class="chk"><input type="checkbox" name="areas" value="Resgate"> Resgate</label>
      <label class="chk"><input type="checkbox" name="areas" value="Lar temporário"> Lar temporário</label>
      <label class="chk"><input type="checkbox" name="areas" value="Eventos de adoção"> Eventos de adoção</label>
      <label class="chk"><input type="checkbox" name="areas" value="Arrecadação e logística"> Arrecadação e logística</label>
    </fieldset>

    <div class="full">
      <label class="chk"><input type="checkbox" name="confirmo" required> Confirmo que as informações são verdadeiras e autorizo o uso dos meus dados para contato sobre o voluntariado.</label>
      <p class="note">Usamos seus dados só para organizar o trabalho voluntário, conforme a LGPD.</p>
    </div>

    <div class="full">
      <button class="btn" type="submit">Enviar cadastro</button>
      <button class="btn alt" type="reset">Limpar</button>
    </div>
    <div class="full" id="status" role="status" aria-live="polite"></div>
  </form>
</div></section></main>

<footer><div class="wrap"><p>© 2026 Pata Voluntária. <a href="projetos.html">Conheça nossos projetos</a></p></div></footer>
<script src="script.js"></script>
</body>
</html>
